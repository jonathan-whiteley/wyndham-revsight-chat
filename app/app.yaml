# Databricks App: RevSight Chat (Wyndham power-user chat: curated Genie agents + Genie One)
#
# Do not edit the {{...}} placeholders: scripts/deploy.sh fills them from
# config.env in the copy it uploads. The warehouse and Genie space IDs come
# from the app's bound resources (scripts/bind_resources.sh).
command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]

env:
  - name: CATALOG
    value: "{{CATALOG}}"
  - name: SCHEMA
    value: "{{SCHEMA}}"
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql_warehouse
  - name: GENIE_SPACE_NT
    valueFrom: genie_space_nt
  - name: GENIE_SPACE_STR
    valueFrom: genie_space_str
